<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="Rule-based ATO SQL Python investigation workflow">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071727"/><stop offset="1" stop-color="#102b39"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#1d4150" stroke-width="1" fill="none" opacity=".38"/></pattern></defs>
 <rect width="1200" height="570" fill="url(#bg)"/><rect width="1200" height="570" fill="url(#grid)"/>
 <text x="60" y="88" fill="white" font-size="42" font-weight="bold" font-family="Arial">From event logs to an investigation queue</text><text x="60" y="125" fill="#a6cbd0" font-size="20" font-family="Arial">Rule-based educational workflow: signals, scoring, human review</text><rect x="60" y="181" width="245" height="260" rx="18" fill="#143541" stroke="#6ddccb" stroke-width="2"/><text x="78" y="227" font-size="24" font-family="Arial" font-weight="bold" fill="#6ddccb">01</text><text x="78" y="286" font-size="25" font-family="Arial" font-weight="bold" fill="white">Event logs</text><text x="78" y="336" font-size="20" font-family="Arial" fill="#c2d7df">Login, device,</text><text x="78" y="364" font-size="20" font-family="Arial" fill="#c2d7df">account changes</text><rect x="355" y="181" width="245" height="260" rx="18" fill="#143541" stroke="#6ddccb" stroke-width="2"/><text x="373" y="227" font-size="24" font-family="Arial" font-weight="bold" fill="#6ddccb">02</text><text x="373" y="286" font-size="25" font-family="Arial" font-weight="bold" fill="white">SQL flags</text><text x="373" y="336" font-size="20" font-family="Arial" fill="#c2d7df">R1 to R5B</text><text x="373" y="364" font-size="20" font-family="Arial" fill="#c2d7df">0/1 indicators</text><rect x="650" y="181" width="245" height="260" rx="18" fill="#143541" stroke="#f0bc77" stroke-width="2"/><text x="668" y="227" font-size="24" font-family="Arial" font-weight="bold" fill="#f0bc77">03</text><text x="668" y="286" font-size="25" font-family="Arial" font-weight="bold" fill="white">Python scores</text><text x="668" y="336" font-size="20" font-family="Arial" fill="#c2d7df">Weighted signals</text><text x="668" y="364" font-size="20" font-family="Arial" fill="#c2d7df">30+ alert threshold</text><rect x="945" y="181" width="245" height="260" rx="18" fill="#143541" stroke="#f0bc77" stroke-width="2"/><text x="963" y="227" font-size="24" font-family="Arial" font-weight="bold" fill="#f0bc77">04</text><text x="963" y="286" font-size="25" font-family="Arial" font-weight="bold" fill="white">Review</text><text x="963" y="336" font-size="20" font-family="Arial" fill="#c2d7df">Prioritised queue</text><text x="963" y="364" font-size="20" font-family="Arial" fill="#c2d7df">Human decisions</text><path d="M308 310h40m-12 -10 12 10-12 10" fill="none" stroke="#a1d2ce" stroke-width="3"/><path d="M603 310h40m-12 -10 12 10-12 10" fill="none" stroke="#a1d2ce" stroke-width="3"/><path d="M898 310h40m-12 -10 12 10-12 10" fill="none" stroke="#a1d2ce" stroke-width="3"/><text x="60" y="505" fill="#a8c4cd" font-size="18" font-family="Arial">Scores indicate review priority — not fraud probability or confirmation.</text></svg>