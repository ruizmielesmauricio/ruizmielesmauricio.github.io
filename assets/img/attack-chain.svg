<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Possible account takeover sequence">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071727"/><stop offset="1" stop-color="#102b39"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#1d4150" stroke-width="1" fill="none" opacity=".38"/></pattern></defs>
 <rect width="1200" height="580" fill="url(#bg)"/><rect width="1200" height="580" fill="url(#grid)"/>
 <text x="64" y="92" fill="white" font-size="44" font-weight="bold" font-family="Arial">How an account takeover can unfold</text><text x="64" y="128" fill="#a6cbd0" font-size="20" font-family="Arial">A simplified sequence of evidence, not proof of an attack</text><rect x="65" y="180" width="245" height="270" rx="18" fill="#143541" stroke="#6ddccb" stroke-width="2"/><circle cx="99" cy="221" r="19" fill="#6ddccb"/><text x="99" y="228" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#092330">1</text><text x="83" y="285" fill="white" font-family="Arial" font-size="22" font-weight="bold">Exposure</text><text x="83" y="331" fill="#c2d7df" font-family="Arial" font-size="18">Phishing / leaks</text><rect x="352" y="180" width="245" height="270" rx="18" fill="#143541" stroke="#6ddccb" stroke-width="2"/><circle cx="386" cy="221" r="19" fill="#6ddccb"/><text x="386" y="228" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#092330">2</text><text x="370" y="285" fill="white" font-family="Arial" font-size="22" font-weight="bold">Unusual login</text><text x="370" y="331" fill="#c2d7df" font-family="Arial" font-size="18">New device / IP</text><rect x="639" y="180" width="245" height="270" rx="18" fill="#143541" stroke="#f0bc77" stroke-width="2"/><circle cx="673" cy="221" r="19" fill="#f0bc77"/><text x="673" y="228" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#092330">3</text><text x="657" y="285" fill="white" font-family="Arial" font-size="22" font-weight="bold">Account changes</text><text x="657" y="331" fill="#c2d7df" font-family="Arial" font-size="18">Email / password</text><rect x="926" y="180" width="245" height="270" rx="18" fill="#143541" stroke="#f0bc77" stroke-width="2"/><circle cx="960" cy="221" r="19" fill="#f0bc77"/><text x="960" y="228" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#092330">4</text><text x="944" y="285" fill="white" font-family="Arial" font-size="22" font-weight="bold">Investigation</text><text x="944" y="331" fill="#c2d7df" font-family="Arial" font-size="18">Correlate signals</text><path d="M315 316h32m-10 -9 10 9-10 9" fill="none" stroke="#b0dfda" stroke-width="3"/><path d="M602 316h32m-10 -9 10 9-10 9" fill="none" stroke="#b0dfda" stroke-width="3"/><path d="M889 316h32m-10 -9 10 9-10 9" fill="none" stroke="#b0dfda" stroke-width="3"/><text x="65" y="510" fill="#aac8d0" font-family="Arial" font-size="19">Not every unfamiliar login or account change is fraudulent.</text></svg>